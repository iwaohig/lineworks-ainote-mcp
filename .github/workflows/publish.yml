# Publishes the package to PyPI (Trusted Publishing, no API token) and then the
# server metadata to the official MCP Registry (GitHub OIDC), when a tag like
# v0.1.0 is pushed. The tag must match the version in pyproject.toml.
#
# One-time setup on PyPI: add a "pending publisher" for project
# lineworks-ainote-mcp with owner iwaohig, repository lineworks-ainote-mcp,
# workflow publish.yml, environment pypi.

name: Publish

on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - name: Check that the tag matches pyproject.toml
        run: |
          TAG=${GITHUB_REF#refs/tags/v}
          VER=$(uv version --short)
          test "$TAG" = "$VER" || { echo "tag v$TAG != pyproject version $VER"; exit 1; }
          jq -e --arg v "$VER" '.version == $v and .packages[0].version == $v' server.json >/dev/null \
            || { echo "server.json version does not match $VER"; exit 1; }
      - run: uv build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  pypi:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  mcp-registry:
    needs: pypi
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v5
      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher
      - name: Wait for the package to be visible on PyPI
        run: |
          VER=${GITHUB_REF#refs/tags/v}
          for i in $(seq 1 30); do
            curl -fsS "https://pypi.org/pypi/lineworks-ainote-mcp/$VER/json" >/dev/null && exit 0
            sleep 10
          done
          echo "PyPI release $VER not visible yet"; exit 1
      - run: ./mcp-publisher validate
      - run: ./mcp-publisher login github-oidc
      - run: ./mcp-publisher publish
